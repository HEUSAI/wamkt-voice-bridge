name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: heusai-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: HEUSAI CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Match the production Dockerfile.
          node-version: 20
          cache: npm
      - name: Install the committed dependency tree
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Check every tracked JavaScript file
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const files = execFileSync('git', ['ls-files', '-z', '--', '*.js'])
            .toString().split('\0').filter(Boolean);
          if (!files.length) throw new Error('No tracked JavaScript files found');
          for (const file of files) {
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          }
          NODE
      - name: Build the production image
        run: docker build --tag wamkt-voice-bridge:ci .
      - name: Boot and check health without external network or credentials
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --network none \
            --env PORT=3001 --env POOL_SIZE=0 \
            --env OPENAI_API_KEY= --env ELEVEN_LABS_API_KEY= \
            --env BRIDGE_SECRET= --env WAMKT_URL=http://127.0.0.1:9 \
            wamkt-voice-bridge:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in {1..20}; do
            if docker exec "$container_id" node -e '
              const assert = require("node:assert/strict");
              fetch("http://127.0.0.1:3001/health", { signal: AbortSignal.timeout(2000) })
                .then(async response => {
                  assert.equal(response.status, 200);
                  const health = await response.json();
                  assert.equal(health.ok, true);
                  assert.equal(health.service, "wamkt-voice-bridge");
                  assert.equal(health.pool, "0/0");
                }).catch(() => process.exit(1));
            '; then
              exit 0
            fi
            sleep 1
          done
          echo 'The isolated production image did not become healthy' >&2
          exit 1
